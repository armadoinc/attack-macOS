<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#05070a" />
  <title>{% block title %}attack-macOS{% endblock %}</title>
  <link rel="stylesheet" href="{{ site_prefix }}/assets/app.css" />
</head>
<body>
  <input type="checkbox" id="nav-toggle" class="nav-toggle" tabindex="-1" />
  <label class="burger" for="nav-toggle" aria-label="Toggle navigation menu"><span></span><span></span><span></span></label>
  <aside class="sidebar">{% block sidebar %}{% endblock %}</aside>
  <label class="scrim" for="nav-toggle" aria-hidden="true"></label>
  <div class="shell">
    <header class="topbar">{% block topbar %}{% endblock %}</header>
    <main class="content {% block content_class %}{% endblock %}">{% block content %}{% endblock %}</main>
  </div>
  <script src="{{ site_prefix }}/assets/app.js" defer></script>
</body>
</html>
